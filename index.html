<title>Visitas Llahuen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: libreta de terreno. Lista cronológica de visitas, formulario en secciones cortas, reportes como tablas de campo y un mapa lineal de Chile por latitud. */
:root {
  --bg: #EDF0EA;
  --surface: #FFFFFF;
  --surface-2: #F5F7F3;
  --ink: #17251D;
  --muted: #5B6A60;
  --line: #D3DBD1;
  --leaf: #2A6846;
  --leaf-soft: #DCEBE1;
  --berry: #B1243B;
  --berry-soft: #F6DDE1;
  --ok: #2E7D4F;
  --good: #6E8F2D;
  --warn: #B26B00;
  --bad: #BE3030;
  --info: #1F6F8B;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1611; --surface: #18211B; --surface-2: #1E2921; --ink: #E5EDE6; --muted: #95A59A; --line: #2C382F;
    --leaf: #78C795; --leaf-soft: #20382A; --berry: #F2788A; --berry-soft: #43202A;
    --ok: #6FCB93; --good: #A7C95A; --warn: #E3A33A; --bad: #F07A7A; --info: #5DB4D4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1611; --surface: #18211B; --surface-2: #1E2921; --ink: #E5EDE6; --muted: #95A59A; --line: #2C382F;
  --leaf: #78C795; --leaf-soft: #20382A; --berry: #F2788A; --berry-soft: #43202A;
  --ok: #6FCB93; --good: #A7C95A; --warn: #E3A33A; --bad: #F07A7A; --info: #5DB4D4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 14px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 21px; }
.brand b { color: var(--berry); font-weight: 700; }
.sync { white-space: nowrap; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync[data-act] { cursor: pointer; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--ok); }
.sync.off i { background: var(--warn); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tab { border: 0; background: transparent; padding: 6px 4px; border-radius: 10px; font-weight: 600; font-size: 12.5px; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tab[aria-current="true"] { color: var(--leaf); background: var(--leaf-soft); }
.tab.new { background: var(--berry); color: #fff; }
.tab.new[aria-current="true"] { background: var(--berry); color: #fff; box-shadow: inset 0 0 0 2px color-mix(in srgb, #fff 55%, transparent); }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }

section.view { padding-top: 18px; display: flex; flex-direction: column; gap: 16px; }
.h-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 { font-size: 24px; }
h3 { font-size: 17px; }

/* controls */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14px; min-height: 40px; }
.btn:hover { border-color: var(--leaf); }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0F1611; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1611; } }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input[type=text], input[type=search], input[type=date], input[type=number], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
textarea { min-height: 96px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 0; border-color: var(--info); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.panel > h3 { display: flex; align-items: center; gap: 8px; }
.panel > h3 .push { margin-left: auto; }

/* chips / pills */
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 13px; line-height: 1.2; }
button.chip { cursor: pointer; min-height: 36px; }
button.chip[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: #fff; }
:root[data-theme="dark"] button.chip[aria-pressed="true"] { color: #0F1611; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.chip[aria-pressed="true"] { color: #0F1611; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.e-Excelente { --c: var(--ok); } .e-Bueno { --c: var(--good); } .e-Regular { --c: var(--warn); } .e-Crítico { --c: var(--bad); }
.t-Positivo { --c: var(--ok); } .t-Oportunidad { --c: var(--info); } .t-Riesgo { --c: var(--warn); } .t-Reclamo { --c: var(--bad); } .t-Recomendación { --c: var(--muted); }
.zone-tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--leaf); background: var(--leaf-soft); padding: 2px 8px; border-radius: 5px; }
.ejemplo { font-family: var(--font-mono); font-size: 10.5px; color: var(--berry); border: 1px dashed var(--berry); padding: 1px 6px; border-radius: 4px; }

/* visit cards */
.cards { display: flex; flex-direction: column; gap: 10px; }
.vcard { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; }
.vcard:hover { border-color: var(--leaf); }
.vcard .nm { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.vcard .meta { color: var(--muted); font-size: 13px; }
.vcard .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.vcard .foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.flag { font-family: var(--font-mono); font-size: 12px; }
.flag.r { color: var(--warn); } .flag.c { color: var(--bad); }
.thumbs { display: flex; gap: 4px; }
.thumbs img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }

.strip { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.strip .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.strip button.lnk { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty p { margin: 0; max-width: 46ch; }

/* form */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 4px; font-weight: 600; font-size: 13.5px; cursor: pointer; min-height: 44px; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 18%, var(--surface)); border-color: var(--c); color: var(--c); }
.dest { display: grid; grid-template-columns: 150px 1fr auto; gap: 8px; align-items: start; }
@media (max-width: 520px) { .dest { grid-template-columns: 1fr auto; } .dest select { grid-column: 1 / -1; } }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.ph { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); aspect-ratio: 1; }

function filteredVisits() {
  const { q, zona, variedad, tipo, cliente, estr } = S.f;
  const nq = norm(q);
  return sortedVisits().filter(v => {
    if (zona && zonaV(v) !== zona) return false;
    if (variedad && !v.variedades.includes(variedad)) return false;
    if (tipo && v.tipo !== tipo) return false;
    if (cliente && norm(v.cliente) !== norm(cliente)) return false;
    if (estr && !isEstr(v.cliente)) return false;
    if (nq) {
      const hay = norm([v.cliente, v.predio, v.comuna, v.region, v.notas, v.manejo, v.fitoDetalle, v.recomendaciones, v.destacados.map(d => d.texto).join(" ")].join(" "));
      if (!hay.includes(nq)) return false;
    }
    return true;
  });
}

}

async function gpsFix() {

  const st = $("#gpsstat"), btn = $('[data-act="gps"]'), stp = $('[data-act="gpsstop"]');
  btn.disabled = true; stp.hidden = false; st.textContent = "Buscando señal GPS… quédate quieto y al aire libre.";
  GPSJOB = gpsMeasure({ maxMs: 45000, goalAcc: 3, onUpdate: r => { if (r) st.textContent = `Midiendo… precisión actual ±${r.acc} m (${r.n} lecturas). Se detiene sola al llegar a ±3 m o a los 45 s.`; } });

/* ---- EXIF (GPS y fecha) ---- */
function readExif(buf) {
  try {
    const dv = new DataView(buf);
    if (dv.getUint16(0) !== 0xFFD8) return {};
    let off = 2;
    while (off < dv.byteLength - 4) {
      const mk = dv.getUint16(off), len = dv.getUint16(off + 2);
      if (mk === 0xFFE1 && dv.getUint32(off + 4) === 0x45786966) {
        const tiff = off + 10, le = dv.getUint16(tiff) === 0x4949;
        const u16 = o => dv.getUint16(o, le), u32 = o => dv.getUint32(o, le);
        const tsz = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8 };
        const ifd = o => {
          const out = {}, n = u16(tiff + o);
          for (let i = 0; i < n; i++) {
            const e = tiff + o + 2 + i * 12, tag = u16(e), type = u16(e + 2), cnt = u32(e + 4);
            const size = (tsz[type] || 1) * cnt, p = size <= 4 ? e + 8 : tiff + u32(e + 8);
            out[tag] = { type, cnt, p };
          }
          return out;
        };
        const ascii = t => { let s = ""; for (let i = 0; i < t.cnt - 1; i++) s += String.fromCharCode(dv.getUint8(t.p + i)); return s; };
        const rat = (t) => { const a = []; for (let i = 0; i < t.cnt; i++) a.push(u32(t.p + i * 8) / (u32(t.p + i * 8 + 4) || 1)); return a; };
        const i0 = ifd(u32(tiff + 4)), res = {};
        if (i0[0x8769]) { const ex = ifd(u32(i0[0x8769].p)); if (ex[0x9003]) { const m = ascii(ex[0x9003]).match(/^(\d{4}):(\d{2}):(\d{2})/); if (m) res.fecha = `${m[1]}-${m[2]}-${m[3]}`; } }
        if (i0[0x8825]) {
          const g = ifd(u32(i0[0x8825].p));
          if (g[1] && g[2] && g[3] && g[4]) {
            const la = rat(g[2]), lo = rat(g[4]);
            let lat = la[0] + la[1] / 60 + la[2] / 3600, lng = lo[0] + lo[1] / 60 + lo[2] / 3600;
            if (ascii(g[1])[0] === "S") lat = -lat; if (ascii(g[3])[0] === "W") lng = -lng;
            if (isFinite(lat) && isFinite(lng) && (lat || lng)) { res.lat = +lat.toFixed(6); res.lng = +lng.toFixed(6); }
          }
        }
        return res;
      }
      if ((mk & 0xFF00) !== 0xFF00) break;
      off += 2 + len;
    }
  } catch (e) { }

}

}

const haOf = cs => cs.reduce((s, c) => s + (Number(c.ultima.superficie) || 0), 0);

const PHOTOS = new Map(), PHFAIL = new Map(); let phQ = new Set(), phT = 0;

async function flushPhotos() {

function makeSbAdapter() {
  const T = () => SB.from("visitas");
  const db = { collection: () => ({
    doc: id => ({
      async set(obj) { const { error } = await T().upsert({ id, data: obj }); if (error) throw sbErr(error); if (SB_PULL) SB_PULL(); },
      async update(patch) {
        const r = await T().select("data").eq("id", id).maybeSingle(); if (r.error) throw sbErr(r.error); if (!r.data) throw Object.assign(new Error("no existe"), { code: "not_found" });
        const u = await T().update({ data: { ...r.data.data, ...patch } }).eq("id", id).select("id"); if (u.error) throw sbErr(u.error);
        if (!u.data || !u.data.length) throw Object.assign(new Error("sin permiso"), { code: "invalid_argument" });
        if (SB_PULL) SB_PULL();
      },
      async delete() { const d = await T().delete().eq("id", id).select("id"); if (d.error) throw sbErr(d.error); if (SB_PULL) SB_PULL(); }
    }),
    onSnapshot(cb, errcb) {
      let timer = 0;
      const emit = rows => cb({ docs: rows.map(r => ({ id: r.id, data: () => r.data })) });
      const pull = async () => {
        try {
          const { data, error } = await T().select("id,data").order("actualizado", { ascending: false }).range(0, 4999);
          if (error) { errcb && errcb(sbErr(error)); return; }
          lsSet("visitas", data); emit(data);
        } catch (e) { errcb && errcb(sbErr(e)); }
      };
      SB_PULL = pull;
      const kick = () => { clearTimeout(timer); timer = setTimeout(pull, 400); };
      const cached = lsGet("visitas"); if (cached) emit(cached);
      pull();
      window.addEventListener("online", kick); document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
      setInterval(() => { if (!document.hidden && navigator.onLine !== false) pull(); }, 20000);
    }
  }) };

    async upload(blob) { const id = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); const data = await blobToDataUrl(blob); const { error } = await SB.from("fotos").upsert({ id, data }); if (error) throw sbErr(error); PHOTOS.set(id, data); return { id }; },
    async delete(id) { await SB.from("fotos").delete().eq("id", id); PHOTOS.delete(id); }
  };
  return { db, assets };
}
